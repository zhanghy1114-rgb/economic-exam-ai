## 金融专业知识和实务（12 章 · 140 分）

### 板块一 基础与体系（1-2）

#### 第 1 章 金融学基础

##### 利率计算
- 单利 I=P·i·n｜复利 FV=PV(1+i)^n
- 现值 PV=FV/(1+i)^n；永续年金 PV=C/i
- 货币时间价值四因素：本金·利率·时间·计息方式

##### 利率决定理论
- 古典：储蓄＝投资（实物因素）
- 凯恩斯：流动性偏好（货币供求）→ 利率是放弃流动性的报酬
- 可贷资金：实物＋货币都看
- 期限结构：预期理论（可替代）·市场分割（不可替代）·流动性偏好（含风险溢价）
- 风险结构：信用·流动性·税收·期限

##### 汇率
- 直接标价（我国）＝1 外币=X 本币，数字变大＝本币贬值
- 决定理论：购买力平价·利率平价·国际收支说·货币主义
- 变动因素：国际收支·利率·通胀·增长·预期·央行干预
- 影响：贬值→出口↑进口↓·资本外流·外债负担↑·国内物价↑

#### 第 2 章 金融体系 ★整章重写

##### 六大体系
- 金融机构体系（银行为主）
- 金融市场体系（货币/资本/外汇/衍生品）
- 金融工具体系
- 金融调控体系（央行）
- 金融监管体系
- 金融基础设施体系（钱走清算·人看征信·账走登记·场在交易）

##### 五篇大文章
- 科技·绿色·普惠·养老·数字（科绿普养数）

##### 五大监管
- 机构（看是谁）·行为（看干啥）·功能（看业务）·穿透（看到底）·持续（看全程）

### 板块二 金融机构（3-5）

#### 第 3 章 商业银行

##### 三大业务
- 负债：存款·同业存放·向央行借款·金融债
- 资产：贷款·债券投资·现金资产
- 表外：担保承诺·衍生交易·代理业务

##### 经营原则（四）
- 三性：安全·流动·效益（安全与流动同向，效益与二者对立）
- 审慎经营·分业经营·金融创新（2026 教材细化）

##### 资本与监管
- 分层：核心一级·其他一级·二级
- 巴Ⅲ：总 8%｜核心一级 4.5%｜一级 6%｜杠杆率 3%｜LCR 100%
- 我国办法：核心一级 5%｜一级 6%｜总 8%（比巴Ⅲ更严）
- 补充工具：留存收益·永续债·二级资本债·定增

##### 资产负债管理
- 缺口·久期·利率敏感性；利率互换＝只换利息不换本金

#### 第 4 章 保险公司

##### 类型与原则
- 财产险（含责任·信用保证）vs 人身险（寿·健康·意外）
- 原则：保险利益·最大诚信·损失补偿·近因·代位求偿（仅财产险）
- 资金运用铁律：安全＞流动＞收益

##### 承保与理赔 ★新增
- 承保：核保→承保→续保
- 理赔：报案→查勘→定损→核赔→赔付；近因原则定责

##### 再保险
- 比例：成数·溢额
- 非比例：险位超赔·事故超赔·赔付率超赔

#### 第 5 章 证券公司与基金管理公司

##### 证券公司
- 业务：经纪·承销保荐·自营·资管·两融·做市
- 内控三道防线；净资本与风控指标

##### 基金类型
- 风险排序：股票＞混合＞债券＞货币
- 封闭 vs 开放；主动 vs 被动（指数）

##### 费用
- 管理费·托管费·销售服务费：按日计提、从净值扣
- 申购赎回费：前端/后端

##### 当事人
- 管理人（受托投资）·托管人（保管＋监督，法定职责）·持有人

### 板块三 市场与定价（6-7）

#### 第 6 章 金融市场与金融工具

##### 市场构成
- 货币市场（≤1 年）：同业拆借·回购·票据·大额存单·短期国债
- 资本市场（＞1 年）：股票·中长期债券·基金
- 外汇市场：即期·远期·掉期（央行也是参与者）
- 衍生品：远期·期货·期权·互换

##### 功能
- 资金融通（最基本）·价格发现·风险管理·提供流动性
- 一级市场（发行）vs 二级市场（流通）

#### 第 7 章 金融资产定价 ★★★2026 核心大改

##### 收益与风险
- 期望收益·方差/标准差·协方差·相关系数
- 组合标准差 ≤ 加权平均标准差（分散化）

##### 三大指数
- 夏普＝(Rp−Rf)/σp（总风险）
- 特雷诺＝(Rp−Rf)/βp（系统风险）
- 詹森 α＝Rp−[Rf+β(Rm−Rf)]

##### 模型
- CAPM：Ri＝Rf+β(Rm−Rf)
- APT：多因素·无套利
- 因素模型：单因素/多因素

##### 债券估值
- 价格＝Σ 利息/(1+y)^t ＋ 面值/(1+y)^n
- 票面＞市场利率→溢价；反之折价
- 久期：久期越长，利率变动越敏感

##### 股票估值
- 股利贴现·零增长·戈登 P＝D1/(r−g)
- 市盈率法

##### 衍生品定价 ★新增
- 远期/期货：持有成本 F＝S·e^(r−q)T
- 期权价值＝内在价值＋时间价值
- 五因素：标的价·执行价·剩余期限·波动率·利率
- 看涨看跌平价：C＋PV(K)＝P＋S

### 板块四 治理与货币（8-9）

#### 第 8 章 公司治理与风险管理

##### 公司治理
- 目标：股东价值 / 利益相关者
- 模式：英美（外部市场）·德日（内部银行）·家族
- 三会一层：股东会·董事会·监事会·高管
- 激励约束：股权/期权

##### 全面风险管理
- 八要素：内部环境·目标设定·事项识别·风险评估·风险应对·控制活动·信息沟通·监控
- 三道防线；治理架构
- 策略：规避·降低·分担·承受
- 风险偏好＋限额

##### 专业风险
- 信用·市场·操作·流动性·声誉·战略

##### 内控内审
- 内控五要素；内审独立于管理层

#### 第 9 章 货币供求与货币均衡 ★新增 IS-LM

##### 货币需求四理论
- 费雪 MV＝PT（交易量 T）
- 剑桥 M＝kPY（k＝1/V，持币比例）
- 凯恩斯 L＝L1(Y)+L2(i)（只有他管利率，投机负相关）
- 弗里德曼 M/P＝f(yp)（恒久性收入，货币是资产）

##### 货币供给
- 基础货币＝现金＋准备金；M＝B×K
- 经基口径 K＝1/(准备金率＋结构比率)
- 金融口径 m＝(1+c)/(rd+rt·t+e+c) ⚠️两科不同
- 层次：M0 现金｜M1＝M0＋单位活期｜M2＝M1＋准货币

##### IS-LM ★新增
- IS：产品市场 I＝S，右下斜
- LM：货币市场 L＝M，右上斜
- 交点同时决定均衡利率与收入
- 财政政策移 IS；货币政策移 LM

##### 通胀通缩
- 需求拉动（收货币＋收财政＋增供给）
- 成本推进（收入政策＋反垄断）
- 结构型（调结构）
- 通缩→物价持续跌·债务负担加重

### 板块五 开放与调控监管（10-12）

#### 第 10 章 开放经济均衡 ★新增

##### 国际收支
- 账户：经常·资本与金融·误差遗漏·储备资产
- 失衡成因；调节：支出增减·支出转换·融资

##### 国际储备
- 构成：黄金·外汇（最主要）·IMF 头寸·SDR（记账单位，不能直接支付）
- 作用：补逆差·稳汇率·维持清偿力
- 规模管理与结构管理

##### 资本流动
- 原因与影响；外资、外债管理

##### 三元悖论 ★新增
- 资本自由流动·固定汇率·货币政策独立 → 三者只能取二
- 米德冲突：内部均衡（就业＋物价）vs 外部均衡（国际收支）
- IS-LM-BP：BP 线；资本完全流动时 BP 水平

#### 第 11 章 中央银行与金融调控 ★新增

##### 央行
- 三职能：发行的银行·银行的银行·政府的银行
- 负债（货币发行为最主要）·资产（再贷款·外汇·国债）
- 独立性

##### 货币政策框架
- 工具：准备金率（猛药）·再贴现（温和）·公开市场（灵活）
- 买入＝放水，卖出＝收水
- 操作指标（基础货币·短期利率）→中介目标（M2·社融）→最终目标
- 传导机制；时滞

##### 结构性工具 ★新增
- 再贷款·MLF·PSL·碳减排支持工具
- 特征：兼具总量与结构双重功能（说"只有结构"是错的）

##### 双支柱 ★新增
- 货币政策＋宏观审慎
- 宏观审慎工具：逆周期资本·系统重要性附加·贷款价值比

#### 第 12 章 金融监管

##### 脆弱性与危机 ★新增
- 脆弱性→挤兑→传染→危机
- 四类危机：债务·货币·流动性·综合性（次贷＝综合性案例）

##### 监管目标与理论
- 目标：保护存款人/投资人·维护稳定
- 理论：公共利益论·捕获论·管制成本论

##### 体制
- 分业监管（我国一行一局一会）·统一监管·双峰监管
- 国际协调：巴塞尔委员会·IOSCO·IAIS

##### 国际规则
- 巴塞尔 I/II/III；资本·杠杆率·LCR/NSFR

##### 分业监管内容
- 银行业·保险业·证券业监管重点

## 经济基础知识（37 章 · 6 部分 · 140 分）

### 第一部分 经济学基础（1-10）

#### 第 1 章 社会主义基本经济制度
- 公有制＝国有＋集体＋混合所有制中的国有/集体成分
- 主体地位＝公有资产占优势（量＋质）；国有经济控命脉、起主导
- 非公有制＝个体·私营·外资（外资＝独资＋合资中的外资部分）
- 分配：按劳分配为主体＋按要素分配；初次/再分配/第三次分配
- 体制：市场起决定性作用＋更好发挥政府；价格·供求·竞争三机制
- 2026 教材新增：民营经济促进法·农村土地新规·"三多"（多劳/技高/创新者多得）

#### 第 2 章 市场需求、供给与均衡价格
- 需求七因素：偏好·收入·自身价·替代价·互补价·预期·其他
- 供给六因素：价·本·术·期·关·素
- 均衡价格；保护价（高→过剩→政府收购）vs 最高限价（低→短缺→配给）
- 弹性：需求价格（点/弧）·交叉（替代正/互补负）·收入·供给
- Ed＞1 降价增收；Ed＜1 提价增收
- ⚠️ 供给弹性唯一反派＝生产周期

#### 第 3 章 生产和成本理论
- 企业本质：科斯（节约交易费用）
- 生产函数 Q＝f(L,K)；TP·AP·MP；MP 交 AP 于最高点
- 规模报酬递增/不变/递减；短期 vs 长期
- 成本：TC＝TFC＋TVC；AC＝AFC＋AVC；MC 交 AC、AVC 于最低点
- 机会成本·隐成本·经济利润

#### 第 4 章 市场结构理论
- 四类划分依据：厂商数目·产品差别·进出壁垒·信息
- 完全竞争：P＝AR＝MR，需求线水平；停业点 P＜AVC
- 完全垄断：MR＜P，无供给曲线；三级价格歧视
- 垄断竞争：产品有差别；寡头：卡特尔·博弈
- ⚠️ 倾斜度＝竞争程度（平＝竞争，陡＝垄断）

#### 第 5 章 生产要素市场理论
- 要素需求是引致需求；VMP＝MP×P
- 使用原则：VMP＝MFC（2026 教材改口径，删 MRP 旧表述）
- 劳动供给后弯（工资效应 vs 替代效应）
- 地租·利息·利润

#### 第 6 章 市场失灵和政府的干预
- 帕累托最优＝资源最优配置标准
- 垄断→无谓损失→管制/反垄断
- 外部性：负→庇古税（＝边际外部成本）；正→补贴
- 科斯定理：产权明确＋交易成本为零→结果一样
- 公共物品：非竞争＋非排他→免费搭车→政府提供
- 信息不对称：逆向选择（事前）·道德风险（事后）

#### 第 7 章 国民收入核算和简单宏观经济模型
- GDP 国土原则 / GNI 国民原则
- 支出法 C+I+G+(X−M)；收入法＝劳动者报酬＋生产税净额＋折旧＋营业盈余
- 恒等式 I＝S；消费函数 C＝a+bY，MPC＜APC
- 乘数：购买 1/(1−b)｜税收 −b/(1−b)｜平衡预算＝1
- AD 右下斜；长期 AS 垂直

#### 第 8 章 经济增长和经济发展理论
- 增长 vs 发展（量 vs 质）；增长因素：劳动·资本·技术
- 全要素生产率＝索洛余值
- 新发展理念：创新·协调·绿色·开放·共享
- 新发展格局：双循环；高质量发展
- 中国式现代化五特征
- ★新质生产力（2026 教材新增，掌握级）

#### 第 9 章 价格总水平和就业、失业
- 价格总水平：CPI·PPI·GDP 平减指数
- 失业类型：摩擦·结构·周期·季节性
- 自然失业率；奥肯定律（GDP 与失业反向）
- 菲利普斯曲线：短期替代·长期垂直
- 宏观经济治理

#### 第 10 章 国际贸易理论和政策
- 绝对优势（斯密）·比较优势（李嘉图）·要素禀赋（H-O）
- 倾销三类：掠夺性·持续性·偶然性；反倾销三条件
- 关税 vs 非关税壁垒；出口补贴
- 高水平对外开放：自贸区·一带一路

### 第二部分 财政（11-17）

#### 第 11 章 公共物品与财政职能
- 公共物品：非竞争＋非排他；纯 vs 准公共物品
- 需求曲线垂直加总
- 财政三职能：资源配置·收入分配·经济稳定
- 市场与政府活动边界

#### 第 12 章 财政支出
- 购买性 vs 转移性（公务员工资＝购买性）
- 规模指标：绝对规模·相对规模（占 GDP）
- 增长理论：瓦格纳（扩张）·皮考克魏斯曼（梯度）·马斯格雷夫（阶段）·鲍莫尔（非均衡）
- 效益分析：成本—效益法·最低成本法

#### 第 13 章 财政收入
- 分类：税收·国有资产收益·收费·国债
- 财政集中度·宏观税负
- 税收三特征：强制性·无偿性·固定性
- 税负转嫁：前转·后转·消转·税收资本化；弹性小者承担
- 国债三指标：依存度÷支出｜偿债率÷收入｜负担率÷GDP
- 2026 教材新增：特别国债

#### 第 14 章 税收制度 ★★2026 最大变动
- 税制要素：纳税人·课税对象·税率（比例/累进/定额）·起征点vs免征额
- 增值税（2026.1.1 新法）：13%/9%/6%；进项抵扣；视同应税交易
- 消费税：15 税目；生产·进口·委托加工环节
- 企业所得税：25%｜小微 20%｜高新 15%
- 个人所得税：综合所得 3%-45%｜经营所得 5%-35%｜其他 20%
- 房产税·契税·车船税

#### 第 15 章 政府预算
- 职能与原则（六原则，含公开性）
- 分类：单式/复式；增量/零基

- 三层目标：操作（基础货币·短期利率）→中介（M2·社融·长期利率）→最终

#### 第 27 章 时间序列分析

- 特征与分类：有限（股东 1-50）｜股份（发起人 1-200）

- 股份转让：发起人 1 年·上市 1 年·每年 25%·离职半年
- 合并分立增减资解散清算（清算义务人＝董事）

- 劳动合同：必备 9 项；试用期 3 月/1 月/2 月/6 月；无固定期限；解除三档；经济补偿 N
