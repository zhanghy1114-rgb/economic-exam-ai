/* ============ 2. 构建节点树 ============ */
let root;
function build(node, depth, parentName) {
  if (typeof node === "string") return { name: node, children: [], depth, leaf: true };
  const name = node[0];
  const kids = (node[1] || []).map(c => build(c, depth + 1, name));
  return { name, children: kids, depth, parentName };
}

  if (n.depth >= 3) n.collapsed = true;
  n.children.forEach(setDefault);
})(root);

  maxDepth = 0;
  maxW = [];
  // 第一遍：算宽度、行号（y）
  (function walk(n) {
    maxDepth = Math.max(maxDepth, n.depth);
    n.w = Math.min(textWidth(n.name) + 22, 460);
    maxW[n.depth] = Math.max(maxW[n.depth] || 0, n.w);
    if (n.collapsed || n.children.length === 0) {
      n.y = row * ROW; row++;
    } else {
      n.children.forEach(walk);
      n.y = (n.children[0].y + n.children[n.children.length - 1].y) / 2;
    }
  })(root);
  // 第二遍：列位置按每层最宽的节点累加，避免长名字压到子节点
  xof = [0];
  for (let d = 1; d <= maxDepth; d++) xof[d] = xof[d - 1] + (maxW[d - 1] || 210) + 58;
  (function setX(n) {
    n.x = xof[n.depth] || 0;
    n.children.forEach(setX);
  })(root);
  return row;
}

/* ============ 4. 绘制 ============ */
const svg = document.getElementById("stage");
const NS = "http://www.w3.org/2000/svg";
const viewport = document.createElementNS(NS, "g");
svg.appendChild(viewport);

const COLOR = {
  "金融专业知识和实务 12 章 · 140分": "#1f6fb2",
  "经济基础知识 37 章 · 6部分 · 140分": "#b03a2e"
};
const SUB = ["#1e8449", "#b7950b", "#7d3c98", "#148f77", "#ca6f1e"];

function fillOf(n) {
  if (n.depth === 0) return { bg: "#2c3e50", fg: "#fff", stroke: "#2c3e50" };
  if (n.depth === 1) { const c = COLOR[n.name] || "#2c3e50"; return { bg: c, fg: "#fff", stroke: c }; }
  if (n.depth === 2) { const c = SUB[n.y / ROW % SUB.length | 0] || "#7d3c98"; return { bg: "#fff", fg: c, stroke: c }; }
  if (n.depth === 3) return { bg: "#f2f5fa", fg: "#303133", stroke: "#9aa7b8" };
  return { bg: "#fff", fg: "#555", stroke: "#cfd6e0" };
}

function visibleNodes() {
  const out = [];
  (function walk(n, show) {
    if (!show) return;
    out.push(n);
    if (!n.collapsed) n.children.forEach(c => walk(c, true));
  })(root, true);
  return out;
}

function path(p, c) {
  const x1 = p.x + p.w, y1 = p.y, x2 = c.x - 12, y2 = c.y;
  const mx = (x1 + x2) / 2;
  return `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
}

function render() {
  const rows = layout();
  while (viewport.firstChild) viewport.removeChild(viewport.firstChild);
  const nodes = visibleNodes();

  // 连线
  nodes.forEach(n => {
    if (n.collapsed) return;
    n.children.forEach(c => {
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", path(n, c));
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", n.depth === 0 ? "#8899a8" : (COLOR[root.children[0].name] && n.depth === 1 ? COLOR[n.name] : "#c2cbd6"));
      p.setAttribute("stroke-width", n.depth <= 1 ? 2.2 : 1.4);
      p.setAttribute("stroke-linecap", "round");
      viewport.appendChild(p);
    });
  });

  // 节点
  nodes.forEach(n => {
    const c = fillOf(n);
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "node-hit");
    g.setAttribute("transform", `translate(${n.x},${n.y})`);

    const rect = document.createElementNS(NS, "rect");
    rect.setAttribute("class", "box");
    rect.setAttribute("x", 0);
    rect.setAttribute("y", -13);
    rect.setAttribute("width", n.w);
    rect.setAttribute("height", 26);
    rect.setAttribute("rx", 8);
    rect.setAttribute("fill", c.bg);
    rect.setAttribute("stroke", c.stroke);
    rect.setAttribute("stroke-width", 1.4);
    g.appendChild(rect);

    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", 11);
    t.setAttribute("y", 4.5);
    t.setAttribute("font-size", FONT + (n.depth <= 1 ? 1 : 0));
    t.setAttribute("font-weight", n.depth <= 1 ? "700" : (n.depth === 2 ? "600" : "400"));
    t.setAttribute("fill", c.fg);
    t.textContent = n.name.length > 34 ? n.name.slice(0, 33) + "…" : n.name;
    g.appendChild(t);

    if (n.children.length) {
      const badge = document.createElementNS(NS, "circle");
      badge.setAttribute("cx", n.w - 9);
      badge.setAttribute("cy", 0);
      badge.setAttribute("r", 6.5);
      badge.setAttribute("fill", n.collapsed ? "#b03a2e" : "#fff");
      badge.setAttribute("stroke", n.collapsed ? "#b03a2e" : "#9aa7b8");
      badge.setAttribute("stroke-width", 1.2);
      g.appendChild(badge);
      const sign = document.createElementNS(NS, "text");
      sign.setAttribute("x", n.w - 9);
      sign.setAttribute("y", 4);
      sign.setAttribute("text-anchor", "middle");
      sign.setAttribute("font-size", 11);
      sign.setAttribute("font-weight", "700");
      sign.setAttribute("fill", n.collapsed ? "#fff" : "#9aa7b8");
      sign.textContent = n.collapsed ? "+" : "−";
      g.appendChild(sign);
    }

    g.addEventListener("click", ev => {
      ev.stopPropagation();
      if (!n.children.length) return;
      n.collapsed = !n.collapsed;
      render();
    });
    viewport.appendChild(g);
  });

  // 视口尺寸
  const W = (xof[maxDepth] || 0) + (maxW[maxDepth] || 220) + 120, H = rows * ROW + 80;
  viewport.setAttribute("data-w", W);
  viewport.setAttribute("data-h", H);
  return { W, H };
}

/* ============ 5. 缩放/平移 ============ */
let k = 1, tx = 0, ty = 0;
function apply() { viewport.setAttribute("transform", `translate(${tx},${ty}) scale(${k})`); }
function fit() {
  const W = +viewport.getAttribute("data-w") || 1400;
  const H = +viewport.getAttribute("data-h") || 1500;
  const vw = window.innerWidth, vh = window.innerHeight;
  // 适应「宽度」而不是整张图：49 章全塞进一屏会让字小到看不清，纵向留给拖动
  k = Math.max(0.5, Math.min((vw - 110) / W, 1.15));
  tx = 30; ty = 20;
  apply();
}
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const f = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  const nk = Math.max(0.18, Math.min(3, k * f));
  tx = mx - (mx - tx) * (nk / k);
  ty = my - (my - ty) * (nk / k);
  k = nk;
  apply();
}, { passive: false });

let drag = null;
svg.addEventListener("pointerdown", e => {
  drag = { x: e.clientX, y: e.clientY, tx, ty };
  svg.classList.add("dragging");
});
svg.addEventListener("pointermove", e => {
  if (!drag) return;
  tx = drag.tx + (e.clientX - drag.x);
  ty = drag.ty + (e.clientY - drag.y);
  apply();
});
svg.addEventListener("pointerup", () => { drag = null; svg.classList.remove("dragging"); });
svg.addEventListener("pointerleave", () => { drag = null; svg.classList.remove("dragging"); });

function expandTo(level) {
  (function walk(n) {
    n.collapsed = n.depth >= level && n.children.length > 0;
    n.children.forEach(walk);
  })(root);
  render(); fit();
}

render();
fit();
window.addEventListener("resize", () => { render(); fit(); });
</script>
</body>
</html>
