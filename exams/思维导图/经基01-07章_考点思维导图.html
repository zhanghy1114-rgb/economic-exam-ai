const md = `# 经基第 1-7 章 · 考点思维导图

## 第 1 章 社会主义基本经济制度
### 所有制结构
- 公有制＝国有＋集体＋混合所有制中的**国有/集体成分**
  - 主体地位：公有资产**占优势**（量+质）
  - 国有经济**控命脉**起主导作用
  - 生产目的：**满足全体人民共同需要**
  - 所有权主体：**国务院代表国家**行使
  - 国资委只履行**出资人**职责
- 非公有制＝个体＋私营＋外资
  - 外资＝独资＋合资中的**外资部分**
  - 合资企业含国资→**混合所有制**
  - **就业大头在非公有制**
### 分配制度
- 按劳分配＝多劳多得、**承认差别**、不劳不得
- 按要素分配：劳动/资本/技术/管理/数据
- 初次分配（市场）→再分配（政府）→第三次分配（慈善）
### 市场经济体制
- **市场决定性作用**＋更好发挥政府作用
- 三机制：价格·供求·竞争

## 第 2 章 需求、供给与均衡价格
### 需求
- 七因素：偏好·收入·**自身价**·替代价·互补价·预期·其他
- 价涨量减（右下方倾斜）
### 供给
- 六因素：**价·本·术·期·关·素**（+政策）
- 价涨量增（右上方倾斜）
### 均衡价格与政府干预
- 均衡＝供求相等
- **保护价＝高于均衡→过剩→政府收购**，不收购→黑市
- **最高限价＝低于均衡→短缺→排队/配给制**
### 弹性（价格变在前→数量变在后）
- 价格弹性大看**奢替用重长**
- >1 降价增收（薄利多销）；<1 涨价增收（谷贱伤农）
- 交叉弹性：替代**正**·互补**负**·无关**零**
- 收入弹性：必需 0~1·高档**>1**·低档**负**

## 第 3 章 生产和成本理论
### 企业理论（科斯）
- 企业＝价格机制**替代物**＋交易**内部化**＋**节约交易费用**
- 目标＝利润最大化（非规模）
### 生产函数
- 要素投入与**最大产量**的关系
- 短期只有**劳动**可变（技术不变前提）
- **MP 是 TP 的斜率**：MP>0→TP 涨；MP=0→TP 最大；MP<0→TP 降
### 成本曲线
- **TVC 过原点**；**TC 从纵轴截点（＝TFC）出发**
- **MC 从下方穿过 AVC、ATC 的最低点**
- 最低点顺序 **MC→AVC→ATC**

## 第 4 章 市场结构理论
### 划分三依据
- **产品差别·生产者数目·进入障碍**
### 完全竞争
- 无数·同质·**水平需求线**·价格接受者·**有供给曲线**
- 例子：**农产品**
### 垄断竞争
- 较多·**产品有差别**→**一定程度控制价格**
- 需求线右下·**无供给曲线**·自由进出
- 例子：日用消费品
### 寡头垄断
- **少数几个**·相互依存
- **卡特尔＝违法**
- 例子：汽车、钢铁
### 完全垄断
- **一个**·价格决定者·企业需求线＝行业需求线·**无供给曲线**
- 价格歧视原则：**各市场 MR 相等且＝MC**
- 例子：公共事业

## 第 5 章 生产要素市场
### 要素需求
- **引致需求＋联合需求＋既互补又替代**
- 使用原则 **MRP＝MFC**
- 完全竞争产品市场：**VMP＝MRP**
### 要素供给
- **劳动供给线后弯**（只归劳动·居民侧）
- 替代效应与收入效应**始终反向**
- **收入效应＞替代效应才后弯**
- 最优原则：**劳动边际效用＝闲暇边际效用**
### 完全竞争要素市场
- 企业面对**水平**要素供给线
- **三线合一：MFC＝AFC＝w**

## 第 6 章 市场失灵和政府干预
### 帕累托基准
- 改进＝不损一人而利一人
- **最优＝改不动了＝有经济效率**
- 条件＝完全竞争四假设：**理性·信息完全·无外部性·完全竞争**
### 失灵四原因
- 垄断：产量低、价格高
- 外部性
  - 正外：私收<社收→产**少**→**补贴**
  - 负外：私成<社成→产**多**→**收税**
- 公共物品
  - 非竞争（主）＋非排他（纯才有）；需求线**纵向相加**
  - 纯＝**国防外交治安**；准＝高速/医疗/教育
  - 融资：政府（强制但单一）/私人（多样但不足）/**联合**
  - 排他＝闲置＝违背**效率原则**；递送＝**合同外包**
- 信息不对称
  - **逆向选择＝事前**（劣币驱良币）
  - **道德风险＝事后**（成交后偷懒）
### 政府干预
- 五职能：供公共物品·**矫正外部性**·维持竞争·调节分配·稳定经济
- 反垄断三把尺
  - 协议看**内容**：横向/纵向/轴辐；**安全港只适用纵向**
  - 集中看**营业额**；附条件：**结构＝剥离·行为＝承诺**
  - 支配看**份额**；算法优劣推荐＝**差别待遇**

## 第 7 章 国民收入核算
### GDP 核算（两把尺）
- 支出法＝**C+I+G+(X−M)**：消费＋资本形成＋净出口
- 收入法＝**劳动者报酬＋生产税净额＋固定资产折旧＋营业盈余**
- **转移支付不进 GDP**；资本形成率/最终消费率用支出法算
### 消费与乘数
- **凯恩斯＝绝对收入：MPC<APC**
- 弗里德曼＝持久收入；莫迪利安尼＝生命周期
- 购买乘数＝**1/(1−MPC)**；税收乘数＝**−MPC/(1−MPC)**（永远负）
- MPC0.8→买 1 涨 5、增税 1 砍 4；MPC0.6→减税 1 加 1.5
### 总需求总供给
- 总需求五因素：**利率·货币量·政府购买·税收·预期**（技术进步管供给）
- 长期总供给＝垂直线

## ⚠️ Day 1 易错边界
- 弹性方向：价格变在前，数量变在后
- 双限价：保护高→过剩→收购；限价低→短缺→配给
- 两把尺科目别串：资本形成/净出口＝支出法；折旧/盈余＝收入法
- 曲线归属：完全竞争企业需求线＝水平；企业要素供给线＝水平；劳动供给线＝后弯；垄断/垄断竞争＝无供给曲线
- D1-49/50/51（景气指标·全要素生产率·十四五）严格属**第 8 章**，明天再考
`;

const { Markmap } = window.markmap;

  paddingX: 20,
  initialExpandLevel: 2,
